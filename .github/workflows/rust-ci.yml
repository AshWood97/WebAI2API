name: Rust CI

# WebAI2API-RS 的持续集成：格式、Clippy、单元/集成测试、release 构建。
on:
  push:
    paths:
      - 'WebAI2API-RS/**'
      - '.github/workflows/rust-ci.yml'
      - 'src/**'
      - 'bridge/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'scripts/**'
      - 'webui/**'
  pull_request:
    paths:
      - 'WebAI2API-RS/**'
      - '.github/workflows/rust-ci.yml'
      - 'src/**'
      - 'bridge/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'scripts/**'
      - 'webui/**'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: WebAI2API-RS

jobs:
  check:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 离线兼容性测试需要原 Node 适配器作为行为基线
      - name: Verify src-root layout
        run: test -d ../src/backend/adapter

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build WebUI from a fresh checkout
        run: npm ci --prefix ../webui --ignore-scripts && npm --prefix ../webui run build

      - name: Check WebUI output
        run: test -s webui-dist/index.html

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            WebAI2API-RS/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('WebAI2API-RS/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets -- -D warnings

      # 适配器元数据回归需读取原仓库根（../src）
      - name: cargo test
        run: cargo test
        env:
          WEBAI2API_TEST_SRC_ROOT: ${{ github.workspace }}

      - name: Version sync check
        run: node ../scripts/sync-rs-version.mjs --check

      - name: cargo build --release
        run: cargo build --release

  docker-smoke:
    name: Docker build / startup / WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build RS image
        run: docker build -f WebAI2API-RS/Dockerfile -t webai2api-rs:ci .

      - name: Launch and close Camoufox in Linux image
        run: docker run --rm --shm-size=2g --entrypoint node webai2api-rs:ci /app/rs/bridge/browser-smoke.mjs

      - name: Start isolated RS container and smoke test
        shell: bash
        run: |
          set -euo pipefail
          smoke_data="$(mktemp -d)"
          trap 'docker rm -f webai2api-rs-smoke >/dev/null 2>&1 || true; rm -rf "$smoke_data"' EXIT
          cat > "$smoke_data/config.yaml" <<'YAML'
          server:
            port: 3000
            auth: smoke-secret
          backend:
            pool:
              instances:
                - name: smoke
                  workers:
                    - name: smoke
                      type: smoke-unconfigured
          YAML
          docker run -d --name webai2api-rs-smoke \
            -p 127.0.0.1:3100:3000 \
            -v "$smoke_data:/app/data" \
            --shm-size=2g webai2api-rs:ci
          ready=0
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3100/health >/dev/null; then
              ready=1
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx webai2api-rs-smoke; then
              docker logs webai2api-rs-smoke
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs webai2api-rs-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          curl -fsS -H 'Authorization: Bearer smoke-secret' \
            http://127.0.0.1:3100/admin/status >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3100/admin/status)" = 401
